# À chaque push : on réentraîne le modèle depuis zéro, puis on lance tous les tests.
# Si l'entraînement ne reproduit plus les performances attendues, les tests échouent.
name: CI

on:
  push:
  pull_request:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Entraîner le modèle
        run: cd src && python -m scoring.train

      - name: Lancer les tests
        run: pytest -v
